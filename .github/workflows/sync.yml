name: Sync data

on:
  schedule:
    - cron: '28 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: sync-data
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      needs_sync: ${{ steps.check-version.outputs.needs_sync }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install latest pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check if sync needed
        id: check-version
        run: pnpm exec tsx scripts/check-sync-needed.ts
        env:
          GH_TOKEN: ${{ github.token }}

  sync:
    needs: check
    if: needs.check.outputs.needs_sync == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install latest pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Clone antdv-next source
        run: git clone --filter=tree:0 --no-checkout https://github.com/antdv-next/antdv-next.git antdv-source

      - name: Generate changelog data
        run: pnpm exec tsx scripts/changelog.ts

      - name: Sync version data
        run: pnpm exec tsx scripts/sync.ts

      - name: Remove antdv-next source
        if: always()
        run: rm -rf antdv-source

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- data/

          git commit --no-verify -m "chore(data): sync antdv-next metadata"
          git push origin main
        env:
          GH_TOKEN: ${{ github.token }}
